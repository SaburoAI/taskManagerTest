<div class="col-12">
  <div class="card">


      <!-- Calendar -->
      <div class="mb-5">
          <div id="calendar"></div>
      </div>
        <!-- Cancel/Confirm Btn -->
<div class="row mb-5">
  <div class="col text-end">
      <a href="" id="cancelBtn" class="btn btn-secondary disabled">予約のキャンセル</a>
  </div>
  <form class="col" action="" method="POST">
      {% csrf_token %}
      <input type="hidden" name="room", value="">
      <input type="hidden" name="user", value="">
      <input type="hidden" name="title", value="", id="inputTitle">
      <input type="hidden" name="start_time", value="", id="inputStartTime">
      <input type="hidden" name="end_time", value="", id="inputEndTime">

      <button id="confirmBtn" type="submit" class="btn btn-primary disabled">予約のキャンセル</button>
  </form>
</div> 
  </div>

</div>




{% block script %}
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/locales/ja.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function() {
      function formatDateTime(datetime) {
          const year = datetime.getFullYear();
          const month = String(datetime.getMonth() + 1).padStart(2, '0');
          const day = String(datetime.getDate()).padStart(2, '0');
          const hour = String(datetime.getHours()).padStart(2, '0');
          const minute = String(datetime.getMinutes()).padStart(2, '0');
          return `${year}-${month}-${day}T${hour}:${minute}`;
      }

      var calendarEl = document.getElementById('calendar');
      var eventsData = '{{ events|default:"[]"|escapejs }}';
      var events = [
    {
        title: '会議',
        start: '2025-04-25T10:00:00',
        end: '2025-04-25T11:00:00',
        backgroundColor: '#FF5733',
        borderColor: '#FF5733',
        status: '欠' // 状態を追加
    },
    {
        title: 'ランチミーティング',
        start: '2025-04-26T12:00:00',
        end: '2025-04-26T13:00:00',
        backgroundColor: '#33FF57',
        borderColor: '#33FF57',
        status: '出' // 状態を追加
    },
    {
        title: 'プロジェクトレビュー',
        start: '2025-04-27T15:00:00',
        end: '2025-04-27T16:30:00',
        backgroundColor: '#3357FF',
        borderColor: '#3357FF',
        status: '遅' // 状態を追加
    }];

      try {
          events = JSON.parse(eventsData);
      } catch (e) {
          console.error('Invalid JSON data for events:', e);
          events = [];
      }

      var calendar = new FullCalendar.Calendar(calendarEl, {
          locale: 'ja',  // 日本語ロケールを設定
          buttonText: {
          today:    '今日',
          month:    '月',
          week:     '週',
          day:      '日',
          list:     'リスト'
          },
          events: events,
          initialView: 'timeGridWeek',
          allDaySlot: false,
          height: 500,
          timeZone: 'ja',
          slotMinTime: '09:00:00',  
          slotMaxTime: '22:00:00',
          slotDuration: '00:30:00',
          businessHours: false,
          eventBackgroundColor: '#B8B8B8',
          eventBorderColor: '#B8B8B8',
          selectable: true,
          selectOverlap: false,
          headerToolbar: {
            left: 'prev,next today',
            center: 'title',
            right: 'dayGridMonth,timeGridWeek,timeGridDay'
          },
          select: function(info) {
              const reservationTitle = prompt('予約のタイトルを入力してください。');
              if (reservationTitle) {
                  calendar.addEvent({
                      title: reservationTitle,
                      start: info.start,
                      end: info.end,
                  });
                  var inputTitle = document.getElementById('inputTitle');
                  var inputStartTime = document.getElementById('inputStartTime');
                  var inputEndTime = document.getElementById('inputEndTime');
                  inputTitle.value = reservationTitle;
                  inputStartTime.value = formatDateTime(info.start);
                  inputEndTime.value = formatDateTime(info.end);
                  document.getElementById('confirmBtn').classList.remove('disabled');
                  document.getElementById('cancelBtn').classList.remove('disabled');
              }
          },
          eventContent: function(arg) {
            // イベントの中身をカスタマイズ
            let statusBadge = '';
            if (arg.event.extendedProps.status) {
                statusBadge = `<span class="badge badge-danger" style="position: absolute; top: 2px; right: 2px;">${arg.event.extendedProps.status}</span>`;
            }
            return {
                html: `
                    <div style="position: relative;">
                        ${statusBadge}
                        <div>${arg.event.title}</div>
                    </div>
                `
            };
        }
      });
      calendar.render();

      // ドロップダウンメニューのイベントリスナーを追加
      document.querySelectorAll('.dropdown-item').forEach(function(item) {
          item.addEventListener('click', function(event) {
              event.preventDefault();
              var view = event.target.getAttribute('data-view');
              if (view) {
            calendar.changeView(view);
        }   
          });
      });
  });
</script>
<style>
  @media (max-width: 768px) {
      #calendar {
          font-size: 12px; /* フォントサイズを小さくする */
      }
      .fc-toolbar-title {
          font-size: 14px; /* タイトルのフォントサイズを調整 */
      }
      .fc-daygrid-event {
          font-size: 10px; /* イベントのフォントサイズを調整 */
      }
  }
  .badge {
    display: inline-block;
    padding: 0.25em 0.4em;
    font-size: 75%;
    font-weight: 700;
    line-height: 1;
    text-align: center;
    white-space: nowrap;
    vertical-align: baseline;
    border-radius: 0.25rem;
}

.badge-danger {
    color: #fff;
    background-color: #dc3545;
}
</style>
{% endblock script %}
